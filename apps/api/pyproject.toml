[project]
name = "jutsu-api"
version = "0.1.0"
description = "JUTSU FastAPI gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jutsu-core",
    "jutsu-db",
    "jutsu-retrieval",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "httpx>=0.28.1",
    "cryptography>=50.0.1",
    "anthropic>=1.2.0",
    # The doorbell half of ADR 0012: the API publishes a per-org drain message after it
    # enqueues a durable job row. Postgres remains the queue; losing the message loses
    # nothing but latency.
    "arq>=0.26",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jutsu_api"]
