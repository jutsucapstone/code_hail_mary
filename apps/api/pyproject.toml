[project]
name = "jutsu-api"
version = "0.1.0"
description = "JUTSU FastAPI gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jutsu-core",
    "jutsu-db",
    "jutsu-retrieval",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "httpx>=0.28.1",
    "cryptography>=50.0.1",
    "anthropic>=1.2.0",
    # `zoneinfo` reads the operating system's tz database, and there isn't one on
    # Windows or in a slim container — `ZoneInfo("Asia/Kolkata")` raises
    # ZoneInfoNotFoundError. The sync schedule stores IANA names and renders the next
    # run in the organisation's own zone, so the data has to travel with the code.
    "tzdata>=2025.2",
    # The doorbell half of ADR 0012: the API publishes a per-org drain message after it
    # enqueues a durable job row. Postgres remains the queue; losing the message loses
    # nothing but latency.
    "arq>=0.26",
    # Bulk employee onboarding accepts the spreadsheet an HR team already has. A `.xlsx`
    # is a zip of XML and cannot be read as text, so the alternative to this dependency
    # is telling every administrator to re-save the file as CSV first. It is read
    # strictly bounded and read-only — see `jutsu_api.bulk_invitations.parse_xlsx`.
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jutsu_api"]
