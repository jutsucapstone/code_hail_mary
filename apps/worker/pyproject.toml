[project]
name = "jutsu-worker"
version = "0.1.0"
description = "JUTSU ingestion, extraction and batch worker"
requires-python = ">=3.12,<3.13"
dependencies = ["jutsu-core", "arq>=0.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jutsu_worker"]
