[project]
name = "jutsu-worker"
version = "0.1.0"
description = "JUTSU ingestion, extraction and batch worker"
requires-python = ">=3.12,<3.13"
# The ingestion pipeline composes the existing packages rather than reimplementing them:
# jutsu-connectors fetches, jutsu-core masks and chunks, jutsu-retrieval embeds and
# persists vectors, jutsu-db owns the schema and the org-scoped session.
dependencies = [
    "jutsu-core",
    "jutsu-db",
    "jutsu-connectors",
    # Graph ingestion (ADR 0022). Optional at runtime in exactly the way the API's copy
    # is: with no `NEO4J_URI` the worker enqueues no `graph.document` jobs at all, and
    # ingestion, embedding and extraction are untouched by its absence.
    "jutsu-graph",
    # The same provider chain the API answers through (ADR 0024). Extraction is a model
    # call like any other, and a background job that can only reach one vendor stops the
    # moment that vendor does — which is what happened.
    "jutsu-llm",
    "jutsu-retrieval",
    # `make seed` writes a run receipt, which is the only record of what a seed cost.
    "jutsu-evals",
    "arq>=0.26",
    # Decrypting stored provider tokens for sync fetchers (Fernet).
    "cryptography>=50.0.1",
    # The production worker is a private Cloud Run service rung by Cloud Tasks (ADR 0017).
    # arq stays the dev transport; these serve `jutsu_worker.http`.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jutsu_worker"]
