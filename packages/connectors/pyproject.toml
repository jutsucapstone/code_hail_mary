[project]
name = "jutsu-connectors"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jutsu-core",
    # Live provider connectors call provider REST APIs; tests script httpx.MockTransport.
    "httpx>=0.27",
    # Knowledge Basket extraction (ADR 0020). Three pure-Python readers, each parsing
    # UNTRUSTED input, so each is bounded by size and by page/slide/paragraph count
    # before it is called and all of them run in the worker rather than the API.
    # `openpyxl` was already vendored for bulk onboarding and is reused here.
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jutsu_connectors"]
