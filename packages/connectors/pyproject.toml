[project]
name = "jutsu-connectors"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jutsu-core",
    # Live provider connectors call provider REST APIs; tests script httpx.MockTransport.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jutsu_connectors"]
