[project]
name = "jutsu-llm"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# httpx and nothing else. All three providers speak the same OpenAI-compatible
# `POST /v1/chat/completions`, so a vendor SDK per provider would be three large
# dependency trees for what is one authenticated POST each — and three sets of
# exception types to translate instead of one set of HTTP status codes.
#
# A package rather than a module inside `apps/api`, because the worker's extraction
# needs the same chain and an app may not import another app. That is the whole reason
# this moved out of `jutsu_api` (ADR 0024).
dependencies = ["jutsu-core", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jutsu_llm"]
