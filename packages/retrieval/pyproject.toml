[project]
name = "jutsu-retrieval"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# google-auth and httpx, not google-cloud-aiplatform. The SDK pulls a very large
# dependency tree for what is one authenticated POST, and this package needs exactly
# two things from it: Application Default Credentials, and a URL.
#
# jutsu-db is a real dependency, not a convenience: EMBEDDING_DIM lives there, and
# the settings validate against it so the client and the column cannot disagree.
dependencies = ["jutsu-core", "jutsu-db", "google-auth>=2.35", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jutsu_retrieval"]
