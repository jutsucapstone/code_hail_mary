[project]
name = "jutsu-core"
version = "0.1.0"
description = "JUTSU domain models, enums and typed errors"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jutsu_core"]
