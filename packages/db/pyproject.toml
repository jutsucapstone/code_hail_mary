[project]
name = "jutsu-db"
version = "0.1.0"
description = "JUTSU Postgres schema, migrations and session management"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jutsu-core",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jutsu_db"]
