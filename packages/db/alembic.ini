# Alembic config for the JUTSU Postgres schema.
#
# sqlalchemy.url is intentionally absent: env.py reads DATABASE_URL so a connection
# string is never committed, per spec 4.10.

[alembic]
script_location = src/jutsu_db/migrations
prepend_sys_path = src
# Zero-padded so versions sort lexically the same way they apply.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
