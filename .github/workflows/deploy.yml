name: Deploy

# Only `main`, and only behind a green CI. The gate is `needs:` on the reusable workflow
# rather than a copy of its steps: a duplicated gate drifts, and it drifts silently — the
# deploy keeps passing while what it claims to have verified has changed underneath.
#
# `workflow_dispatch` is here for a redeploy of an unchanged commit (a rollback, or a
# revision lost to a bad config change) without pushing an empty commit to trigger it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys are not worth racing. Unlike CI, in-flight runs are *not* cancelled: killing a
# deploy between "migrations applied" and "new revision serving" leaves a schema the
# running code has never seen.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: asia-south1
  REPOSITORY: jutsu
  # Cloud Run service names. Kept here because three jobs and the migration step all
  # have to agree on them.
  API_SERVICE: jutsu-api
  WEB_SERVICE: jutsu-web
  REAP_JOB: jutsu-reap
  MIGRATE_JOB: jutsu-migrate
  # The nightly clock (ADR 0018). Created once out of band with its Cloud Scheduler
  # trigger — docs/deploy.md §10 — and repointed at each new image here.
  SYNC_JOB: jutsu-sync
  WORKER_SERVICE: jutsu-worker
  # The Cloud Tasks queue the API rings and the worker re-rings (ADR 0017). Created
  # once, out of band — docs/deploy.md §9 — the pipeline only names it.
  DRAIN_QUEUE: jutsu-drain

jobs:
  # ------------------------------------------------------------------ gate
  ci:
    uses: ./.github/workflows/ci.yml

  # ------------------------------------------------------------------ build
  build:
    name: build and push images
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Scoped to this job, not the workflow. `id-token: write` is what lets a run mint a
    # Google credential, so it is granted where it is needed and nowhere else — a
    # workflow-wide grant would hand the same power to every future job added here.
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        # The commit SHA, never `latest`. A mutable tag makes "which code is running"
        # unanswerable and makes rollback a rebuild rather than a redeploy.
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # Workload Identity Federation, so no service-account JSON key exists to leak.
      # GitHub mints a short-lived OIDC token, Google exchanges it for an access token
      # scoped to this repository, and it expires with the job. A downloaded key would be
      # a permanent credential sitting in repository secrets, which §4.10 rules out.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      # One step per image rather than a matrix: they have different contexts, different
      # build arguments and different cache scopes, and a matrix that has to branch on the
      # target for each of those is harder to read than three explicit blocks.
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/worker:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          # Baked in, not injected at runtime: `NEXT_PUBLIC_*` is inlined by the compiler,
          # so a Cloud Run variable set later is ignored and canonical URLs, sitemap and
          # OG tags would all point somewhere else.
          #
          # Written here rather than read from `vars.`, deliberately. This value ships
          # inside the JavaScript bundle, so it is public whatever we do with it, and the
          # deployment has exactly one public origin. Holding it out of band bought
          # nothing and cost something real: the variable was set to the run.app hostname
          # and silently outranked every default underneath it, so the site kept building
          # with the wrong canonical host and the workflow looked correct while it did.
          # One origin, in version control, where a diff shows it changing.
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://jutsu.co.in
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ------------------------------------------------------------------ migrate
  migrate:
    name: migrate the database
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    # A GitHub environment, so a reviewer can be required before production schema
    # changes. Everything else here is reversible by redeploying the previous image;
    # this step is the one that is not.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Before the services, never after. The new revision expects the new schema, so
      # deploying first means every request between the two steps hits code whose tables
      # do not exist yet.
      #
      # This ordering is only safe for migrations that are additive — a column dropped
      # here breaks the revision still serving traffic. Destructive changes go out as two
      # deploys: stop using the column, ship, then drop it.
      #
      # A Cloud Run job rather than a step running alembic directly, because the job runs
      # inside the VPC with the Cloud SQL connector attached. Reaching the database from a
      # GitHub runner would mean exposing it to the internet or shipping a proxy and a
      # credential into CI.
      # `--command alembic`, not `uv`: uv exists only in the build stage of the image, and
      # the runtime stage puts the venv on PATH. `--command uv` fails with "executable
      # file not found", which the first real migration run against Cloud Run proved.
      #
      # `--args=` with an equals sign, not a space. The value begins with `-c`, and
      # gcloud's parser reads a space-separated value starting with a dash as the next
      # flag — "argument --args: expected one argument". The equals form binds it.
      #
      # Note for anyone editing the block below: a `#` comment inside a backslash-continued
      # command **breaks it**. The continuation ends at the comment and the next line
      # starts a new command, so `--command alembic` is run as a program and the step exits
      # 127. Every note about these commands therefore lives above the step, not inside it.
      - name: Update the migration job to this revision
        run: |
          gcloud run jobs update "${MIGRATE_JOB}" \
            --image "${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/api:${{ needs.build.outputs.image_tag }}" \
            --region "${REGION}" \
            --command=alembic \
            --args="-c,packages/db/alembic.ini,upgrade,head" \
            --quiet

      # `MIGRATION_DATABASE_URL`, which is the owner. The application connects as
      # `jutsu_app` (NOSUPERUSER NOBYPASSRLS) and deliberately cannot run DDL — pointing
      # migrations at the app role fails, and pointing the app at the owner would make
      # every row-level security policy inert while every isolation test still passed.
      - name: Run the migrations
        run: |
          gcloud run jobs execute "${MIGRATE_JOB}" \
            --region "${REGION}" \
            --wait \
            --quiet

      # The graph's own numbered Cypher (ADR 0022), through the same job and the same
      # image. Constraints and indexes only; it writes no data and deletes none.
      #
      # **Skipped, not failed, when there is no graph.** The three secrets are created
      # out of band — docs/deploy.md §12 — and until they exist this deployment simply
      # has no Neo4j: `/readyz` says `not_configured`, retrieval is pgvector alone, and a
      # pipeline that failed here would block every unrelated deploy over an optional
      # dependency that was never promised.
      #
      # `gcloud secrets describe` reads metadata, never a version's payload, so nothing
      # sensitive can reach the log even on failure.
      #
      # The command and args are replaced on the shared job rather than a second job
      # being created, exactly as the reaper and the sync job are repointed: the previous
      # step set `--command=alembic`, this one sets python, and the next deploy sets it
      # back. `--update-secrets` merges, so the database secrets that job already mounts
      # are left alone.
      - name: Apply the graph migrations, if a graph is configured
        run: |
          if ! gcloud secrets describe jutsu-neo4j-uri --quiet >/dev/null 2>&1; then
            echo "no jutsu-neo4j-uri secret — this deployment has no graph; skipping"
            exit 0
          fi
          echo "graph secrets present — applying graph migrations"
          gcloud run jobs update "${MIGRATE_JOB}" \
            --image "${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/api:${{ needs.build.outputs.image_tag }}" \
            --region "${REGION}" \
            --command=python \
            --args="-m,jutsu_graph.cli,upgrade" \
            --update-secrets "NEO4J_URI=jutsu-neo4j-uri:latest,NEO4J_USER=jutsu-neo4j-user:latest,NEO4J_PASSWORD=jutsu-neo4j-password:latest" \
            --quiet
          gcloud run jobs execute "${MIGRATE_JOB}" \
            --region "${REGION}" \
            --wait \
            --quiet

  # ------------------------------------------------------------------ deploy
  deploy:
    name: deploy to Cloud Run
    needs: [build, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    environment: production

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # `--set-env-vars` REPLACES the whole set rather than merging into it, and here
      # that replacement is the contract: the pipeline fully OWNS the environment, so
      # every variable the service needs is listed below and config drifts back to what
      # this file says, never away from it. Anything set by hand with
      # `gcloud run services update --update-env-vars` survives exactly until the next
      # deploy and then disappears — which presents as a working mail transport that
      # stops working on an unrelated push. Secrets are the one exception, and the flag
      # below differs for exactly that reason.
      #
      # SMTP_FROM is not optional with this provider. Resend authenticates as the literal
      # username `resend`, and the settings fall back to the username when no From is
      # given, which would put `resend` in a From header and fail every send.
      #
      # JUTSU_APP_URL is what the authentication emails build their links from. It has a
      # production default in `config.py`, so omitting it here would still work — it is
      # stated anyway because this file is the one place the deployed origin is written
      # down (the web image is built with the same value at line 120), and a default
      # nobody can see from the deploy is a default nobody updates when the domain moves.
      #
      # JUTSU_BASKET_BUCKET is what makes the Knowledge Basket exist. `ObjectStore
      # .from_env()` returns None when it is unset and every basket route then answers
      # 503 — correct behaviour for a deployment without storage, and exactly the
      # "not configured" state a deployment WITH storage must never fall into. It is
      # derived from the project id rather than stored as its own secret because a bucket
      # name is not a credential: it is globally visible in every signed URL, and the
      # access it grants comes from the runtime service account's `objectAdmin` binding
      # (scoped to this bucket) plus `signBlob` on itself — never from knowing the name.
      # The bucket is created out of band; docs/deploy.md carries the commands.
      #
      # Secrets are referenced, never passed. They mount from Secret Manager at
      # container start, so nothing sensitive appears in the workflow, in a Cloud Run
      # environment variable, or in `gcloud run services describe` output (§4.10).
      #
      # `--update-secrets`, NOT `--set-secrets`, and the difference is a contract with
      # operators: per gcloud's flag semantics, --update-secrets MERGES into the
      # previous revision's secret set, while --set-secrets replaces it wholesale. The
      # per-provider OAuth pairs (JUTSU_OAUTH_*_CLIENT_ID / _CLIENT_SECRET) are
      # pipeline-owned below, exactly like the deployment-wide set: one Google client
      # serves four provider ids and one Atlassian client serves two, so the same
      # secret mounts under several env names (docs/oauth-provider-setup.md maps
      # them), and with --set-secrets every push would silently wipe whatever an
      # operator had added since. Rotation is a `gcloud secrets versions add`; every
      # mount reads :latest. The cost of merge semantics is that this list can only
      # add; retiring a secret is a manual `--remove-secrets`, which is the right
      # ceremony for an action that revokes.
      # `--allow-unauthenticated`, deliberately. The Next proxy calls this over the public
      # URL carrying no Google credential, so a private service rejects every request a
      # browser makes. Closing it properly means granting the web service account
      # `run.invoker` and having the proxy attach an identity token — a real improvement,
      # and not one to make blind. Recorded rather than quietly left looking intentional.
      # The worker: a private service, scaled from zero, rung by Cloud Tasks (ADR 0017).
      # `--no-allow-unauthenticated` plus one `run.invoker` binding for the runtime
      # service account — the identity every task's OIDC token names — is the gate; the
      # header check inside the app is the belt over it. Concurrency 1, so one instance
      # runs one drain; the drain bounds itself at 480 s and the request timeout sits
      # above it, under the queue's dispatch deadline. Deployed BEFORE the API, which
      # learns this service's URL in its own step.
      #
      # The API's secret set minus mail and the email pepper: the worker refreshes
      # provider tokens (the OAuth client pairs), decrypts them (JUTSU_CONNECTION_KEY),
      # extracts (the LLM chain — the same three keys, in the same order, that the API
      # answers through, ADR 0024) and embeds (Vertex, as the runtime account). The
      # worker rings itself from the address a task arrives on, so it needs no
      # WORKER_DRAIN_URL of its own. Notes sit above the command for the continuation
      # reason the API step records.
      # Whether this deployment has a graph at all, decided once and used by both
      # services (ADR 0022). Neo4j is optional: the secrets are created out of band —
      # docs/deploy.md §12 — and a deploy must not fail because they are absent.
      #
      # All three are required together. Mounting a partial set would give the services
      # connection details they cannot authenticate with, which reads as "degraded" in
      # `/readyz` for ever rather than as the "not configured" it actually is.
      #
      # Nothing here reads a secret's payload; `describe` returns metadata only.
      - name: Resolve the graph configuration
        run: |
          if gcloud secrets describe jutsu-neo4j-uri --quiet >/dev/null 2>&1 \
            && gcloud secrets describe jutsu-neo4j-user --quiet >/dev/null 2>&1 \
            && gcloud secrets describe jutsu-neo4j-password --quiet >/dev/null 2>&1; then
            echo "GRAPH_SECRETS=,NEO4J_URI=jutsu-neo4j-uri:latest,NEO4J_USER=jutsu-neo4j-user:latest,NEO4J_PASSWORD=jutsu-neo4j-password:latest" >> "$GITHUB_ENV"
            echo "graph configured — both services will mount its credentials"
          else
            echo "GRAPH_SECRETS=" >> "$GITHUB_ENV"
            echo "no graph configured — /readyz will report neo4j: not_configured"
          fi

      # The LLM chain (ADR 0024): Cerebras, OpenRouter, Groq, in that order, serving
      # BOTH services — the API's answers and the worker's extraction go through the same
      # three keys, because a background job that can only reach one vendor stops the
      # moment that vendor does, which is exactly what happened to extraction for five
      # days. Every one of them is optional and the chain is whichever ones resolve.
      #
      # Same shape as the graph step above: a secret that does not exist is skipped rather
      # than failing the deploy, because an availability layer must never become the reason
      # a release cannot ship. `describe` reads metadata only — no version payload is ever
      # fetched, so no key can reach a log.
      #
      # **Zero resolved secrets is a working deploy with no answers**, and the step says
      # so as a workflow warning rather than only in the per-secret lines: /v1/ask returns
      # 503 and extraction jobs are never enqueued. A warning and not a failure on purpose
      # — refusing to ship the frontend and every other surface over a missing model key
      # would be the wrong trade — but it is the line to look for in a release log when
      # answers are unavailable afterwards.
      #
      # Model ids and bounds come from repository *variables*, not secrets: a model id is
      # on every invoice and in the vendor's public catalogue, and holding it out of band
      # would mean the workflow could not show what it deployed. Unset is meaningful for
      # each — the adapter falls back to the default ADR 0024 records and pins in a test.
      #
      # **Lists use semicolons.** `--set-env-vars` splits its own argument on commas, so a
      # comma-separated order would have to be set through gcloud's `^@^` delimiter form —
      # rewriting one long production-critical flag to configure one list. The application
      # accepts both separators for this reason (docs/deploy.md §13).
      - name: Resolve the LLM providers
        env:
          ORDER: ${{ vars.JUTSU_LLM_PROVIDER_ORDER }}
          CEREBRAS_MODEL: ${{ vars.JUTSU_CEREBRAS_MODEL }}
          OPENROUTER_MODEL: ${{ vars.JUTSU_OPENROUTER_MODEL }}
          OPENROUTER_FALLBACK_MODELS: ${{ vars.JUTSU_OPENROUTER_FALLBACK_MODELS }}
          GROQ_MODEL: ${{ vars.JUTSU_GROQ_MODEL }}
          PROVIDER_TIMEOUT: ${{ vars.JUTSU_LLM_PROVIDER_TIMEOUT_SECONDS }}
          TOTAL_TIMEOUT: ${{ vars.JUTSU_LLM_TOTAL_TIMEOUT_SECONDS }}
          MAX_ATTEMPTS: ${{ vars.JUTSU_LLM_MAX_PROVIDER_ATTEMPTS }}
        run: |
          SECRETS=""
          for pair in \
            "CEREBRAS_API_KEY=jutsu-cerebras-api-key" \
            "OPENROUTER_API_KEY=jutsu-openrouter-api-key" \
            "GROQ_API_KEY=jutsu-groq-api-key"; do
            var="${pair%%=*}"
            secret="${pair##*=}"
            if gcloud secrets describe "${secret}" --quiet >/dev/null 2>&1; then
              SECRETS="${SECRETS},${var}=${secret}:latest"
              echo "llm provider configured: ${secret}"
            else
              echo "llm provider absent: ${secret} (skipped)"
            fi
          done
          echo "LLM_SECRETS=${SECRETS}" >> "$GITHUB_ENV"
          if [ -z "${SECRETS}" ]; then
            echo "::warning title=No LLM provider configured::/v1/ask will answer 503 and extraction jobs will not be enqueued. Create at least one of jutsu-cerebras-api-key, jutsu-openrouter-api-key or jutsu-groq-api-key in Secret Manager (docs/deploy.md 13)."
          fi

          ADDITIONS=""
          for pair in \
            "LLM_PROVIDER_ORDER=${ORDER}" \
            "LLM_PROVIDER_TIMEOUT_SECONDS=${PROVIDER_TIMEOUT}" \
            "LLM_TOTAL_TIMEOUT_SECONDS=${TOTAL_TIMEOUT}" \
            "LLM_MAX_PROVIDER_ATTEMPTS=${MAX_ATTEMPTS}" \
            "CEREBRAS_MODEL=${CEREBRAS_MODEL}" \
            "OPENROUTER_MODEL=${OPENROUTER_MODEL}" \
            "OPENROUTER_FALLBACK_MODELS=${OPENROUTER_FALLBACK_MODELS}" \
            "GROQ_MODEL=${GROQ_MODEL}"; do
            if [ -n "${pair##*=}" ]; then
              ADDITIONS="${ADDITIONS},${pair}"
            fi
          done
          echo "LLM_ENV=${ADDITIONS}" >> "$GITHUB_ENV"
          echo "llm provider settings: ${ADDITIONS:-<all defaults>}"

      - name: Deploy the worker
        run: |
          gcloud run deploy "${WORKER_SERVICE}" \
            --image "${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/worker:${{ needs.build.outputs.image_tag }}" \
            --region "${REGION}" \
            --platform managed \
            --service-account "${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --add-cloudsql-instances "${{ secrets.CLOUD_SQL_INSTANCE }}" \
            --command uvicorn \
            --args "jutsu_worker.http:app,--host,0.0.0.0,--port,8080" \
            --set-env-vars "JUTSU_ENV=prod,LOG_LEVEL=INFO,GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},VERTEX_LOCATION=asia-south1,JUTSU_BASKET_BUCKET=${{ secrets.GCP_PROJECT_ID }}-basket,CLOUD_TASKS_QUEUE=projects/${{ secrets.GCP_PROJECT_ID }}/locations/${REGION}/queues/${DRAIN_QUEUE},CLOUD_TASKS_SERVICE_ACCOUNT=${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}${LLM_ENV}" \
            --update-secrets "DATABASE_URL=jutsu-database-url:latest,JUTSU_CONNECTION_KEY=jutsu-connection-key:latest,JUTSU_OAUTH_GOOGLE_DRIVE_CLIENT_ID=jutsu-oauth-google-client-id:latest,JUTSU_OAUTH_GOOGLE_DRIVE_CLIENT_SECRET=jutsu-oauth-google-client-secret:latest,JUTSU_OAUTH_GMAIL_CLIENT_ID=jutsu-oauth-google-client-id:latest,JUTSU_OAUTH_GMAIL_CLIENT_SECRET=jutsu-oauth-google-client-secret:latest,JUTSU_OAUTH_GOOGLE_CALENDAR_CLIENT_ID=jutsu-oauth-google-client-id:latest,JUTSU_OAUTH_GOOGLE_CALENDAR_CLIENT_SECRET=jutsu-oauth-google-client-secret:latest,JUTSU_OAUTH_GOOGLE_MEET_CLIENT_ID=jutsu-oauth-google-client-id:latest,JUTSU_OAUTH_GOOGLE_MEET_CLIENT_SECRET=jutsu-oauth-google-client-secret:latest,JUTSU_OAUTH_SLACK_CLIENT_ID=jutsu-slack-client-id:latest,JUTSU_OAUTH_SLACK_CLIENT_SECRET=jutsu-slack-client-secret:latest,JUTSU_OAUTH_GITHUB_CLIENT_ID=jutsu-oauth-github-client-id:latest,JUTSU_OAUTH_GITHUB_CLIENT_SECRET=jutsu-oauth-github-client-secret:latest,JUTSU_OAUTH_JIRA_CLIENT_ID=jutsu-atlassian-oauth-client-id:latest,JUTSU_OAUTH_JIRA_CLIENT_SECRET=jutsu-atlassian-oauth-client-secret:latest,JUTSU_OAUTH_CONFLUENCE_CLIENT_ID=jutsu-atlassian-oauth-client-id:latest,JUTSU_OAUTH_CONFLUENCE_CLIENT_SECRET=jutsu-atlassian-oauth-client-secret:latest,JUTSU_OAUTH_ZOOM_CLIENT_ID=jutsu-zoom-oauth-client-id:latest,JUTSU_OAUTH_ZOOM_CLIENT_SECRET=jutsu-zoom-oauth-client-secret:latest${GRAPH_SECRETS}${LLM_SECRETS}" \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 1 \
            --timeout 1800 \
            --memory 1Gi \
            --no-allow-unauthenticated \
            --quiet

          gcloud run services add-iam-policy-binding "${WORKER_SERVICE}" \
            --region "${REGION}" \
            --member "serviceAccount:${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --role roles/run.invoker \
            --quiet

      - name: Deploy the API
        run: |
          # SMTP_FROM carries a display name, so the whole --set-env-vars value stays
          # inside double quotes: that keeps `<` and `>` as text rather than shell
          # redirection. There is no comma in it, which is what the flag splits on.
          #
          # No REDIS_URL, still: production rings Cloud Tasks (ADR 0017). The worker's
          # URL is read off the service deployed in the previous step, the way the web
          # step reads this service's — a literal would aim a fork's deploy at this
          # project's worker. CLOUD_TASKS_* and WORKER_DRAIN_URL select the transport;
          # with any of the three missing the API refuses to start, and the readiness
          # check below fails the deploy.
          #
          # --concurrency 8: spec §20's guardrail for a service that holds LLM calls
          # open (80 stays the web default). Cloud Run scales out on saturation.
          # This comment sits above the command rather than among its continuation
          # lines. A `#` after a trailing backslash ends the continuation, so the rest
          # of the flags become their own command — still valid shell, so `bash -n`
          # reports nothing, and the failure surfaces as an unrelated exit 127.
          WORKER_URL="$(gcloud run services describe "${WORKER_SERVICE}" --region "${REGION}" --format 'value(status.url)')"
          test -n "${WORKER_URL}" || { echo "no worker URL resolved"; exit 1; }
          echo "api will ring ${WORKER_URL}/drain"

          # The revision serving BEFORE this deploy, so the readiness check below can
          # actually roll back. `--to-revisions LATEST=0` cannot: after a deploy LATEST
          # *is* the new revision, and gcloud refuses to send a service to zero traffic.
          # An unready API therefore kept 100% of traffic while the step exited 1.
          API_PREV="$(gcloud run services describe "${API_SERVICE}" --region "${REGION}" --format json \
            | jq -r '[.status.traffic[]? | select(.percent == 100)][0].revisionName // empty')"
          echo "API_PREV=${API_PREV}" >> "$GITHUB_ENV"
          echo "rollback target: ${API_PREV:-<none, first deploy>}"
          gcloud run deploy "${API_SERVICE}" \
            --image "${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/api:${{ needs.build.outputs.image_tag }}" \
            --region "${REGION}" \
            --platform managed \
            --service-account "${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --add-cloudsql-instances "${{ secrets.CLOUD_SQL_INSTANCE }}" \
            --set-env-vars "JUTSU_ENV=prod,LOG_LEVEL=INFO,SMTP_HOST=smtp.resend.com,SMTP_PORT=587,SMTP_FROM=JUTSU <noreply@jutsu.co.in>,JUTSU_APP_URL=https://jutsu.co.in,GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},VERTEX_LOCATION=asia-south1,JUTSU_BASKET_BUCKET=${{ secrets.GCP_PROJECT_ID }}-basket,CLOUD_TASKS_QUEUE=projects/${{ secrets.GCP_PROJECT_ID }}/locations/${REGION}/queues/${DRAIN_QUEUE},CLOUD_TASKS_SERVICE_ACCOUNT=${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }},WORKER_DRAIN_URL=${WORKER_URL}/drain,GRAPHRAG_ENABLED=${{ vars.JUTSU_GRAPHRAG_ENABLED || 'false' }}${LLM_ENV}" \
            --update-secrets "DATABASE_URL=jutsu-database-url:latest,JUTSU_EMAIL_PEPPER=jutsu-email-pepper:latest,SMTP_USERNAME=jutsu-smtp-username:latest,SMTP_PASSWORD=jutsu-smtp-password:latest,JUTSU_CONNECTION_KEY=jutsu-connection-key:latest,JUTSU_OAUTH_GOOGLE_DRIVE_CLIENT_ID=jutsu-oauth-google-client-id:latest,JUTSU_OAUTH_GOOGLE_DRIVE_CLIENT_SECRET=jutsu-oauth-google-client-secret:latest,JUTSU_OAUTH_GMAIL_CLIENT_ID=jutsu-oauth-google-client-id:latest,JUTSU_OAUTH_GMAIL_CLIENT_SECRET=jutsu-oauth-google-client-secret:latest,JUTSU_OAUTH_GOOGLE_CALENDAR_CLIENT_ID=jutsu-oauth-google-client-id:latest,JUTSU_OAUTH_GOOGLE_CALENDAR_CLIENT_SECRET=jutsu-oauth-google-client-secret:latest,JUTSU_OAUTH_GOOGLE_MEET_CLIENT_ID=jutsu-oauth-google-client-id:latest,JUTSU_OAUTH_GOOGLE_MEET_CLIENT_SECRET=jutsu-oauth-google-client-secret:latest,JUTSU_OAUTH_SLACK_CLIENT_ID=jutsu-slack-client-id:latest,JUTSU_OAUTH_SLACK_CLIENT_SECRET=jutsu-slack-client-secret:latest,JUTSU_OAUTH_GITHUB_CLIENT_ID=jutsu-oauth-github-client-id:latest,JUTSU_OAUTH_GITHUB_CLIENT_SECRET=jutsu-oauth-github-client-secret:latest,JUTSU_OAUTH_JIRA_CLIENT_ID=jutsu-atlassian-oauth-client-id:latest,JUTSU_OAUTH_JIRA_CLIENT_SECRET=jutsu-atlassian-oauth-client-secret:latest,JUTSU_OAUTH_CONFLUENCE_CLIENT_ID=jutsu-atlassian-oauth-client-id:latest,JUTSU_OAUTH_CONFLUENCE_CLIENT_SECRET=jutsu-atlassian-oauth-client-secret:latest,JUTSU_OAUTH_ZOOM_CLIENT_ID=jutsu-zoom-oauth-client-id:latest,JUTSU_OAUTH_ZOOM_CLIENT_SECRET=jutsu-zoom-oauth-client-secret:latest${GRAPH_SECRETS}${LLM_SECRETS}" \
            --min-instances 0 \
            --max-instances 10 \
            --concurrency 8 \
            --allow-unauthenticated \
            --quiet

      # A scheduled job, not a running service, and that is a cost decision with a
      # correctness consequence attached.
      #
      # arq's cron scheduler lives inside the worker process, so running it on Cloud Run
      # means a container that never idles — min-instances=1 with CPU throttling off,
      # billed continuously — plus Redis for arq to talk to. Memorystore alone would cost
      # more than every other piece of this deployment put together, to delete a handful
      # of rows every five minutes.
      #
      # Cloud Scheduler invokes this job instead: nothing runs at idle and there is no
      # broker. The arq cron stays in the code for the moment S8 puts a worker on Cloud
      # Run for the ingestion queue's own reasons, at which point the reaper is already
      # wired into the thing that is running and this job can go.
      #
      # The schedule itself is created once, out of band — see docs/deploy.md. The
      # pipeline only points the job at the image it just built.
      - name: Point the reaper job at this revision
        run: |
          gcloud run jobs update "${REAP_JOB}" \
            --image "${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/worker:${{ needs.build.outputs.image_tag }}" \
            --region "${REGION}" \
            --quiet

      # The nightly clock, the same shape and the same reason as the reaper: a scheduler
      # living inside a process means a container that never idles. Cloud Scheduler ticks
      # this every fifteen minutes and `sched.due_organisations` decides who is actually
      # due, in their own timezone, at most once per local day (ADR 0018).
      #
      # It carries the Cloud Tasks variables because it rings the doorbell after
      # enqueueing; without them the rows would wait for an unrelated wake-up. The
      # worker's URL is read off the service, never written down — a literal would aim a
      # fork's deploy at this project's worker.
      - name: Point the nightly sync job at this revision
        run: |
          WORKER_URL="$(gcloud run services describe "${WORKER_SERVICE}" --region "${REGION}" --format 'value(status.url)')"
          test -n "${WORKER_URL}" || { echo "no worker URL resolved"; exit 1; }
          gcloud run jobs update "${SYNC_JOB}" \
            --image "${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/worker:${{ needs.build.outputs.image_tag }}" \
            --region "${REGION}" \
            --set-env-vars "JUTSU_ENV=prod,LOG_LEVEL=INFO,CLOUD_TASKS_QUEUE=projects/${{ secrets.GCP_PROJECT_ID }}/locations/${REGION}/queues/${DRAIN_QUEUE},CLOUD_TASKS_SERVICE_ACCOUNT=${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }},WORKER_DRAIN_URL=${WORKER_URL}/drain" \
            --quiet

      - name: Deploy the web app
        env:
          API_URL_OVERRIDE: ${{ vars.JUTSU_API_URL }}
        run: |
          # Read off the service deployed two steps ago rather than written
          # down. A Cloud Run hostname carries the project *number*, so a
          # literal here would aim a fork's deploy at this project's API and
          # still look like it worked.
          #
          # `:-` rather than `-`: an unset repository variable arrives as an
          # empty string, not as absent, so `${VAR-default}` would accept the
          # empty one and set JUTSU_API_URL to nothing at all.
          API_URL="${API_URL_OVERRIDE:-$(gcloud run services describe \
            "${API_SERVICE}" --region "${REGION}" \
            --format 'value(status.url)')}"
          test -n "${API_URL}" || { echo "no API URL resolved"; exit 1; }
          echo "web will proxy to ${API_URL}"

          # Before the deploy, for the reason the API step records: after one, LATEST is
          # the new revision and there is nothing to roll back TO. Resolving this in the
          # verify step would hand the rollback the very revision it is replacing.
          WEB_PREV="$(gcloud run services describe "${WEB_SERVICE}" --region "${REGION}" --format json \
            | jq -r '[.status.traffic[]? | select(.percent == 100)][0].revisionName // empty')"
          echo "WEB_PREV=${WEB_PREV}" >> "$GITHUB_ENV"

          gcloud run deploy "${WEB_SERVICE}" \
            --image "${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/web:${{ needs.build.outputs.image_tag }}" \
            --region "${REGION}" \
            --platform managed \
            --service-account "${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-env-vars "JUTSU_API_URL=${API_URL}" \
            --min-instances 0 \
            --max-instances 10 \
            --allow-unauthenticated \
            --quiet

      # The deploy is not finished because gcloud exited zero. A revision can be created
      # and still fail its first request — a missing secret, a bad DSN — and without this
      # the pipeline reports success while the site is down.
      - name: Verify the new revisions actually serve
        run: |
          set -euo pipefail
          # The API first, on its own readiness probe: `ready` means Postgres answered
          # and the doorbell transport resolved at startup. A revision that cannot
          # reach the database or refused its queue configuration is rolled back here.
          api_url="$(gcloud run services describe "${API_SERVICE}" --region "${REGION}" --format 'value(status.url)')"
          ready="$(curl -sS "${api_url}/readyz" || true)"
          echo "api readyz: ${ready}"
          if ! echo "${ready}" | grep -q '"status":"ready"'; then
            if [ -n "${API_PREV:-}" ]; then
              echo "api is not ready — rolling back to ${API_PREV}"
              gcloud run services update-traffic "${API_SERVICE}" --region "${REGION}" \
                --to-revisions "${API_PREV}=100" --quiet
            else
              echo "api is not ready, and there is no earlier revision to roll back to"
            fi
            exit 1
          fi
          # The worker is private, so its readiness is Cloud Run's own Ready condition
          # rather than a request from this runner.
          worker_ready="$(gcloud run services describe "${WORKER_SERVICE}" --region "${REGION}" --format json | jq -r '.status.conditions[] | select(.type=="Ready") | .status')"
          echo "worker ready: ${worker_ready}"
          test "${worker_ready}" = "True" || { echo "worker revision is not ready"; exit 1; }
          web_url="$(gcloud run services describe "${WEB_SERVICE}" --region "${REGION}" --format 'value(status.url)')"
          echo "checking ${web_url}"
          for attempt in $(seq 1 10); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "${web_url}/" || true)"
            if [ "${code}" = "200" ]; then
              echo "web is serving (HTTP ${code})"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}, retrying"
            sleep 6
          done
          echo "web never returned 200 — rolling back"
          if [ -n "${WEB_PREV:-}" ]; then
            gcloud run services update-traffic "${WEB_SERVICE}" --region "${REGION}" \
              --to-revisions "${WEB_PREV}=100" --quiet
          else
            echo "no earlier revision to roll back to"
          fi
          exit 1
