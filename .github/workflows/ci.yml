name: CI

# Deliberately NOT `push: branches: [main]`. Deploy runs on that push and calls this
# workflow as its gate, so triggering here as well would run the whole suite twice for
# every merge — once uselessly.
on:
  pull_request:
  # Callable, so deploy.yml gates on this exact job rather than re-listing the checks.
  # A copy of the gate is a gate that drifts, and it drifts silently — the deploy keeps
  # passing while the thing it claims to have verified has changed.
  workflow_call:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps robots.txt, sitemap.xml and OG tags from being built against localhost.
  # The same origin the deploy workflow builds with, so CI compiles the artefact that
  # actually ships rather than a near-miss of it.
  NEXT_PUBLIC_SITE_URL: https://jutsu.co.in
  # Two roles, deliberately. The application role is NOSUPERUSER NOBYPASSRLS, because
  # a superuser bypasses row-level security unconditionally and the whole isolation
  # suite would pass against policies that never engage. Only the owner can run DDL.
  JUTSU_TEST_DATABASE_URL: postgresql+asyncpg://jutsu_app:jutsu_app_ci@localhost:5432/jutsu_test
  JUTSU_TEST_MIGRATION_URL: postgresql+asyncpg://jutsu:jutsu_ci@localhost:5432/jutsu_test
  DATABASE_URL: postgresql+asyncpg://jutsu_app:jutsu_app_ci@localhost:5432/jutsu_test
  MIGRATION_DATABASE_URL: postgresql+asyncpg://jutsu:jutsu_ci@localhost:5432/jutsu_test
  # Neo4j has no row-level security, so `org_id` on every query is the whole tenancy
  # mechanism and the adversarial suite proving it must actually run. A skipped graph
  # suite is unverified tenant isolation, which is exactly what this job exists to catch.
  NEO4J_URI: bolt://localhost:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: jutsu_ci

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real Postgres, not a stand-in. pgvector, RLS and FORCE ROW LEVEL SECURITY have
    # no in-memory equivalent, so without this the packages/db suite would skip and CI
    # would be green on untested tenant isolation.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jutsu
          POSTGRES_PASSWORD: jutsu_ci
          POSTGRES_DB: jutsu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jutsu -d jutsu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # Matches infra/docker/compose.yml: same image, same major version as AuraDB 5.
      # Constraints, fulltext indexes, transaction timeouts and the bitemporal comparisons
      # have no in-memory equivalent, so without this the graph suite would skip and CI
      # would be green on untested tenant isolation.
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/jutsu_ci
          NEO4J_server_memory_heap_max__size: 1G
        ports:
          - 7687:7687
          - 7474:7474
        # Neo4j accepts TCP well before it will answer a query, and the suite's first act
        # is to apply a migration. A long start period is cheaper than a flaky job.
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-packages --frozen

      # Mirrors infra/docker/initdb/01-app-role.sql. Service containers start before
      # checkout, so the init script in the repo cannot be mounted into them — the role
      # has to be created from a step instead. Table privileges come from migration 0001.
      - name: Create the restricted application role
        env:
          PGPASSWORD: jutsu_ci
        run: |
          psql -h localhost -U jutsu -d jutsu_test -v ON_ERROR_STOP=1 -c "CREATE ROLE jutsu_app LOGIN PASSWORD 'jutsu_app_ci' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql -h localhost -U jutsu -d jutsu_test -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO jutsu_app;"

      # Mirrors `make preflight` step by step rather than shelling out to make, so a
      # failure names the stage that broke instead of one opaque exit code.
      - name: Lint (web)
        run: pnpm --filter web lint

      - name: Typecheck (web)
        run: pnpm --filter web typecheck

      - name: Test (commit hook)
        run: node scripts/hooks/preflight-on-commit.test.mjs

      - name: Lint (python)
        run: uv run ruff check .

      - name: Format check (python)
        run: uv run ruff format --check .

      # One invocation per tree, matching `make typecheck-py`. A single
      # `mypy packages apps` sees several modules named "conftest" — mypy derives module
      # names from the nearest directory without an __init__.py — calls it ambiguous and
      # refuses to check anything at all, which is a green step that checked nothing.
      - name: Typecheck (python)
        run: |
          uv run mypy packages
          uv run mypy apps
          uv run mypy conftest.py

      - name: Test (python)
        run: uv run pytest -q

      # The DB suite must actually run. A skip here means tenant isolation is
      # unverified, which is exactly the failure this job exists to catch.
      - name: Assert database tests were not skipped
        run: uv run pytest packages/db -q --no-header -p no:randomly | tee /tmp/db.txt && ! grep -q 'skipped' /tmp/db.txt

      # Same rule for the graph. Its tenancy suite is the only thing standing between a
      # forgotten `WHERE org_id = $org_id` and a cross-tenant read, because Neo4j has no
      # policy layer underneath to fail closed.
      - name: Assert graph tests were not skipped
        run: uv run pytest packages/graph -q --no-header -p no:randomly | tee /tmp/graph.txt && ! grep -q 'skipped' /tmp/graph.txt

      # The build is the real gate for the web app — lint and tsc both pass on things
      # that fail to compile under Turbopack.
      - name: Build (web)
        run: pnpm --filter web build
